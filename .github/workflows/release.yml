name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Full history for uv-dynamic-versioning version derivation

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --python python3.12 --all-groups

      - name: Run checks
        run: |
          uv run --python python3.12 ruff format --check src/ tests/
          uv run --python python3.12 ruff check src/ tests/
          uv run --python python3.12 mypy src/
          uv run --python python3.12 codespell
          uv run --python python3.12 pytest

      - name: Build wheel and sdist
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            dist/*.whl dist/*.tar.gz \
            --title "$TAG_NAME" \
            --generate-notes
